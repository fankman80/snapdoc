name: Build MAUI iOS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      - name: Setup Xcode 27.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.2'

      - name: Install MAUI iOS Workload
        run: |
          dotnet workload install maui-ios

      - name: Show Environment
        run: |
          dotnet --version
          dotnet workload --info
          xcodebuild -version

      - name: Import Certificate (.p12)
        run: |
          # 1. Decode aus Secret
          echo "${{ secrets.IOS_CERTIFICATE_BASE64 }}" | base64 --decode > certificate.p12
          echo "${{ secrets.IOS_PROVISION_BASE64 }}" | base64 --decode > profile.mobileprovision

          # 2. Temporären Schlüsselbund erstellen
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 21)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # 3. Zertifikat importieren
          security import certificate.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "${{ secrets.IOS_CERT_PASSWORD }}" \
            -A \
            -t cert \
            -f pkcs12

          security list-keychain -d user -s "$KEYCHAIN_PATH"

          # 4. Provisioning Profile installieren
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build and Sign IPA
        run: |
          dotnet publish SnapDoc/SnapDoc.csproj \
            -f net11.0-ios \
            -c Release \
            -p:TargetFrameworks=net11.0-ios \
            -p:ArchiveOnBuild=true \
            -p:CodesignKey="Apple Distribution" \
            -p:CodesignProvision="MAUI_AppStore_Distribution" \
            -p:RuntimeIdentifier=ios-arm64
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: SnapDoc-iOS-App
          path: SnapDoc/bin/Release/net11.0-ios/ios-arm64/publish/*.ipa

      - name: Upload to App Store Connect (TestFlight)
        run: |
          xcrun altool --upload-app \
            -f SnapDoc/bin/Release/net11.0-ios/ios-arm64/publish/*.ipa \
            -t ios \
            -u "m.fankhauser@gmx.net" \
            -p "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}"
