name: Build MAUI Android

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Restore Android
        run: dotnet restore SnapDoc/SnapDoc.csproj -p:TargetFramework=net11.0-android

      - name: Decode and save keystore
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [System.IO.File]::WriteAllBytes(
            "SnapDoc/SnapDoc.keystore",
            :FromBase64String($env:ANDROID_KEYSTORE_BASE64)
          )

      - name: Build Android App (Release)
        shell: pwsh
        run: |
          dotnet publish SnapDoc/SnapDoc.csproj -c Release -f net11.0-android --no-restore `
            /p:AndroidKeyStore=true `
            /p:AndroidKeyAlias="${{ secrets.ANDROID_KEY_ALIAS }}" `
            /p:AndroidKeyPassword="${{ secrets.ANDROID_KEY_PASSWORD }}" `
            /p:AndroidStorePassword="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" `
            /p:AndroidKeyStorePath="SnapDoc.keystore" `
            /p:AndroidPackageFormat=aab `
            /p:ApplicationVersion=${{ github.run_number }}

      - name: Upload artifact to GitHub (Backup)
        uses: actions/upload-artifact@v6
        with:
          name: AndroidApp
          path: |
            SnapDoc/bin/Release/net11.0-android/**/*.aab

      - name: Upload to Google Play Console
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: com.ebbe.snapdoc
          releaseFiles: SnapDoc/bin/Release/net11.0-android/**/*-Signed.aab
          tracks: alpha
          status: completed
